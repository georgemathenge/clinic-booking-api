# Render Blueprint: one Docker web service + one managed Postgres.
# Auto-deploy is OFF on purpose: GitHub Actions triggers deploys via a deploy
# hook only after tests pass, so a red build never reaches production.
services:
  - type: web
    name: clinic-booking-api
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-db
          property: connectionString
      - key: CLINIC_TIMEZONE
        value: Africa/Nairobi
      - key: MIN_BOOKING_LEAD_MINUTES
        value: "60"

databases:
  - name: clinic-db
    plan: free
    region: frankfurt
